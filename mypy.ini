# Type-check configuration for the typing ratchet (scripts/check_typing_ratchet.py).
#
# This file holds only the settings shared by every module. Strictness is not
# configured here: the ratchet runs mypy with --strict and enforces it only for
# the modules listed in scripts/typing_strict_modules.txt, so the allowlist is
# one reviewable file rather than hundreds of per-module sections. Run the
# gate, not bare mypy, to get the same answer CI gets.
[mypy]
# Pinned: lane L8 moves this to 3.14 together with the interpreter bump.
python_version = 3.12
files = sonder_runtime
mypy_path = .
namespace_packages = True
explicit_package_bases = True
# Types still flow from every imported module, but only the modules named on the
# command line report errors, so a strict module is judged on its own code.
follow_imports = silent
# Optional or platform-specific third-party packages (pywin32 on Linux, the
# training stack) are not installed everywhere the gate runs.
ignore_missing_imports = True
show_error_codes = True
pretty = False
no_error_summary = True
