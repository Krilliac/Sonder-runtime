name: auto-merge

on:
  pull_request:
    # `edited` covers retargeting: when a stacked PR's base changes to main
    # (its parent merged), auto-merge is queued then; if a PR is retargeted
    # away from main, any queued auto-merge is withdrawn.
    types: [opened, reopened, ready_for_review, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # Only PRs into main: a stacked PR's base branch has no required checks,
    # so auto-merge would merge it at once, before CI (as #563 was).
    # On `edited`, act only when the base branch changed (not title/body edits).
    if: >-
      ${{ !github.event.pull_request.draft
          && github.event.pull_request.base.ref == 'main'
          && (github.event.action != 'edited' || github.event.changes.base != null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enable squash auto-merge
        env:
          # The merge GitHub performs for auto-merge is pushed as whoever
          # enabled it. Enabled with this workflow's GITHUB_TOKEN, that push
          # starts no workflows, so `ci` stopped running on main after
          # bot-enabled merges (none from 2026-09-30 15:31Z). An owner token
          # in the AUTO_MERGE_TOKEN secret (fine-grained PAT or App token with
          # Contents + Pull requests write on this repository only) makes the
          # merge an ordinary push that runs CI. Without the secret this falls
          # back to the old token, so auto-merge itself never breaks.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }}

  disable-auto-merge:
    # Retargeted away from main: a queued auto-merge would otherwise merge the
    # PR into an unprotected branch before CI runs.
    if: >-
      ${{ github.event.action == 'edited'
          && github.event.changes.base != null
          && github.event.pull_request.base.ref != 'main'
          && github.event.pull_request.auto_merge != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disable auto-merge
        env:
          # Same actor as enable-auto-merge (see the note there).
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --disable-auto --repo ${{ github.repository }}
