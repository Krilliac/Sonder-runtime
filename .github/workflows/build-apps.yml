name: build-apps

# Compiles Sonder Runtime for Android, Linux, Windows, and macOS. Every run
# uploads installable artifacts (downloadable from the run's
# "Summary" page). The README's `app-latest` links are a separate mutable
# prerelease snapshot; ordinary and manual runs do not publish or refresh it.
# A matching, release-ready `app-vX.Y.Z` tag additionally publishes a versioned
# GitHub Release with permanent download links.
#
# The repo keeps only the Dart sources (app/lib, app/pubspec.yaml, app/test).
# The native project scaffolding (android/, linux/, windows/, macos/) is
# generated on the fly with `flutter create`, so there is no generated native
# code to maintain in git.

on:
  push:
    branches: [main]
    tags: ["app-v*"]
  # These job names are required branch-protection checks. Run on every PR so
  # documentation or nested-script changes cannot wait forever for statuses
  # that a path filter prevented GitHub from creating.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  APP_ORG: com.sonder.runtime
  SONDER_BUILD_REVISION: ${{ github.sha }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter create --org $APP_ORG --project-name sonder_runtime --platforms=android .
      - name: Configure production networking
        run: python ../scripts/configure_flutter_networking.py .
      - name: Bundle local system
        run: python ../scripts/package_local_system.py --out app/build/local-system --zip app/assets/local-system.zip
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.upload-artifact.outputs.artifact-url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter create --org $APP_ORG --project-name sonder_runtime --platforms=android .
      - name: Configure production networking
        run: python ../scripts/configure_flutter_networking.py .
      - name: Bundle local system
        run: python ../scripts/package_local_system.py --out app/build/local-system --zip app/assets/local-system.zip
      - run: flutter pub get
      - name: Build APK (release, debug-signed so it installs directly)
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk sonder-runtime-android.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload-artifact
        with:
          name: sonder-runtime-android-apk
          path: app/sonder-runtime-android.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.upload-artifact.outputs.artifact-url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter create --org $APP_ORG --project-name sonder_runtime --platforms=linux .
      - name: Configure Sonder Runtime identity
        run: python ../scripts/configure_flutter_networking.py .
      - name: Bundle local system
        run: python ../scripts/package_local_system.py --out app/build/local-system --zip app/assets/local-system.zip
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Add local system to Linux app
        run: cp -a build/local-system build/linux/x64/release/bundle/local-system
      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/app/sonder-runtime-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload-artifact
        with:
          name: sonder-runtime-linux-x64
          path: app/sonder-runtime-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    outputs:
      artifact_url: ${{ steps.upload-artifact.outputs.artifact-url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --org $env:APP_ORG --project-name sonder_runtime --platforms=windows .
      - name: Configure Sonder Runtime identity
        run: python ../scripts/configure_flutter_networking.py .
      - name: Bundle local system
        run: python ../scripts/package_local_system.py --out app/build/local-system --zip app/assets/local-system.zip
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Add local system to Windows app
        run: Copy-Item -Recurse -Force build/local-system build/windows/x64/runner/Release/local-system
      - name: Package Windows bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sonder-runtime-windows-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload-artifact
        with:
          name: sonder-runtime-windows-x64
          path: app/sonder-runtime-windows-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    outputs:
      artifact_url: ${{ steps.upload-artifact.outputs.artifact-url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter create --org $APP_ORG --project-name sonder_runtime --platforms=macos .
      - name: Configure local-network privacy description
        run: python ../scripts/configure_flutter_networking.py .
      - name: Bundle local system
        run: python ../scripts/package_local_system.py --out app/build/local-system --zip app/assets/local-system.zip
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Add local system to macOS app
        run: cp -a build/local-system "build/macos/Build/Products/Release/Sonder Runtime.app/Contents/Resources/local-system"
      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/app/sonder-runtime-macos.zip" "Sonder Runtime.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload-artifact
        with:
          name: sonder-runtime-macos
          path: app/sonder-runtime-macos.zip
          if-no-files-found: error

  integrity:
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
      - name: Resolve authoritative runtime version
        id: runtime-version
        run: python -c "import sonder_version; print('version=' + sonder_version.VERSION)" >> "$GITHUB_OUTPUT"
      - name: Verify artifacts and generate integrity metadata
        run: |
          python scripts/release_artifacts.py dist \
            --version "${{ steps.runtime-version.outputs.version }}" \
            --revision "${{ github.sha }}" \
            --source-uri "${{ github.server_url }}/${{ github.repository }}" \
            --workflow-uri "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --invocation-id "${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sonder-runtime-release-integrity
          path: |
            dist/SHA256SUMS
            dist/sonder-runtime-sbom.cdx.json
            dist/sonder-runtime-provenance.intoto.json
          if-no-files-found: error

  release:
    # Only when a tag like app-v1.0.0 is pushed: gather every platform build
    # and publish a GitHub Release with permanent download links.
    needs: [integrity]
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Require release-ready version identity
        run: python scripts/check_release_version.py --require-release --json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            dist/sonder-runtime-android-apk/sonder-runtime-android.apk
            dist/sonder-runtime-linux-x64/sonder-runtime-linux-x64.tar.gz
            dist/sonder-runtime-windows-x64/sonder-runtime-windows-x64.zip
            dist/sonder-runtime-macos/sonder-runtime-macos.zip
            dist/sonder-runtime-release-integrity/SHA256SUMS
            dist/sonder-runtime-release-integrity/sonder-runtime-sbom.cdx.json
            dist/sonder-runtime-release-integrity/sonder-runtime-provenance.intoto.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Sonder Runtime builds — install on your phone or desktop, then
            point the app at your `sonder_serve.py` server (Settings → Server URL).

            | Platform | Download |
            |---|---|
            | Android  | `sonder-runtime-android.apk` |
            | Linux    | `sonder-runtime-linux-x64.tar.gz` |
            | Windows  | `sonder-runtime-windows-x64.zip` |
            | macOS    | `sonder-runtime-macos.zip` |
            | Checksums | `SHA256SUMS` |
            | SBOM | `sonder-runtime-sbom.cdx.json` |
            | Provenance | `sonder-runtime-provenance.intoto.json` |
