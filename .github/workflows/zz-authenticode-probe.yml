name: zz-authenticode-probe
# TEMPORARY diagnostic for the flaky Authenticode canary; removed before merge.
on:
  pull_request:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Time the fixed verifier against the previous autoloading script
        shell: pwsh
        run: |
          $py = @'
          import os, subprocess, sys, time
          sys.path.insert(0, os.getcwd())
          from sonder_runtime.adapters import artifact_fetch
          exe = os.path.join(os.environ["SystemRoot"], "System32", "WindowsPowerShell", "v1.0", "powershell.exe")
          env = artifact_fetch._powershell_environment()
          literal = exe.replace("'", "''")
          old = ("$ErrorActionPreference='Stop';$s = Get-AuthenticodeSignature -LiteralPath '%s';$cert = $s.SignerCertificate;"
                 "[pscustomobject]@{Status=[string]$s.Status;Subject=$(if ($cert) { [string]$cert.Subject } else { '' })} | ConvertTo-Json -Compress") % literal
          for i in range(5):
              t = time.monotonic()
              r = artifact_fetch._authenticode_signature(exe)
              print("PROBE4", i, "fixed", "wall=%.2fs" % (time.monotonic() - t), r["status"], r["publisher"][:60], flush=True)
              t = time.monotonic()
              c = subprocess.run([exe, "-NoProfile", "-NonInteractive", "-Command", old], capture_output=True, text=True, timeout=180, env=env)
              print("PROBE4", i, "previous", "wall=%.2fs" % (time.monotonic() - t), (c.stdout or "").strip()[:120], flush=True)
          '@
          $py | python -
