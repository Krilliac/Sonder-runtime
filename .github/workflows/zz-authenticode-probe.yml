name: zz-authenticode-probe
# TEMPORARY diagnostic for the flaky Authenticode canary; removed before merge.
on:
  pull_request:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Probe Get-AuthenticodeSignature exactly like artifact_fetch
        shell: pwsh
        run: |
          Get-Service CryptSvc | Format-List Name,Status,StartType
          $py = @'
          import json, os, subprocess, time
          exe = os.path.join(os.environ["SystemRoot"], "System32", "WindowsPowerShell", "v1.0", "powershell.exe")
          keys = ("SystemRoot", "WINDIR", "ComSpec", "PATH", "PATHEXT", "TEMP", "TMP", "USERPROFILE", "APPDATA", "LOCALAPPDATA", "ProgramData")
          env = {k: os.environ[k] for k in keys if os.environ.get(k)}
          literal = exe.replace("'", "''")
          script = ("$ErrorActionPreference='Stop';$s = Get-AuthenticodeSignature -LiteralPath '%s';$cert = $s.SignerCertificate;"
                    "[pscustomobject]@{Status=[string]$s.Status;StatusMessage=[string]$s.StatusMessage;"
                    "Subject=$(if ($cert) { [string]$cert.Subject } else { '' });SignatureType=[string]$s.SignatureType} | ConvertTo-Json -Compress") % literal
          inner = ("$sw=[Diagnostics.Stopwatch]::StartNew();Import-Module Microsoft.PowerShell.Security;$a=$sw.Elapsed.TotalSeconds;"
                   "$s = Get-AuthenticodeSignature -LiteralPath '%s';$b=$sw.Elapsed.TotalSeconds;"
                   "$s2 = Get-AuthenticodeSignature -LiteralPath '%s';$c=$sw.Elapsed.TotalSeconds;"
                   "'IMPORT={0:N2} FIRST={1:N2} SECOND={2:N2} STATUS={3} {4}' -f $a,($b-$a),($c-$b),$s.Status,$s2.Status") % (literal, literal)
          for i in range(6):
              for label, e in (("scrubbed", env), ("fullenv", None)):
                  t = time.monotonic()
                  c = subprocess.run([exe, "-NoProfile", "-NonInteractive", "-Command", "exit 0"], capture_output=True, text=True, timeout=120, env=e)
                  t1 = time.monotonic() - t
                  t = time.monotonic()
                  c = subprocess.run([exe, "-NoProfile", "-NonInteractive", "-Command", inner], capture_output=True, text=True, timeout=180, env=e)
                  print("PROBE2", i, label, "bare_start=%.2fs" % t1, "total=%.2fs" % (time.monotonic() - t), (c.stdout or "").strip()[:200], (c.stderr or "").strip()[:200], flush=True)
          '@
          $py | python -
