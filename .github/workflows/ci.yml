name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # "tests" is a required branch-protection status check (see repo settings)
  # -- keep this job's id and name exactly "tests". Splitting it into a matrix
  # or renaming it changes the reported context and silently strands PRs that
  # can never satisfy the required check. Same constraint build-apps.yml
  # documents for its own job names.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-runtime.txt
      - name: Install deps (stdlib core + mcp for server import)
        run: python -m pip install -r requirements-dev.txt
      - name: Verify MCP compatibility API
        run: >-
          python -c "from mcp.server.mcpserver import MCPServer;
          from mcp.server.mcpserver.tools import ToolManager"
      - name: Enforce architecture boundaries (SPEC-3)
        run: python scripts/check_architecture.py
      - name: Validate master-spec evidence ledger
        run: python scripts/check_requirement_evidence.py
      - name: Enforce legacy error-signal ratchet
        run: python scripts/check_error_signals.py
      - name: Prevent new Git-history privacy debt
        run: python scripts/check_history_privacy.py --json
      - name: Check operator/developer doc links
        run: python scripts/check_doc_links.py
      # The golden evaluation lane is a gate, not a report: exit 1 is a
      # baseline violation (a graded regression or infrastructure trouble
      # in the fixtures), exit 2 a harness error. Both are offline -- the
      # smoke suite replays a checked-in cassette and the policy suite
      # consults the runtime's own permission gate -- and neither touches the
      # runner's durable evaluation history.
      - name: Run the golden evaluation lane (replay cassette, baseline ratchet)
        run: >-
          python eval_harness.py run --suite smoke_python --check-baseline
          --no-record-history --out eval_runs/ci/smoke_python
      - name: Run the tool-policy evaluation lane (real permission gate, baseline ratchet)
        run: >-
          python eval_harness.py run --suite tool_policy_gates --check-baseline
          --no-record-history --out eval_runs/ci/tool_policy_gates
      - name: Run test suite
        # network/model-marked tests are skipped unless --run-network /
        # --run-model is passed (see conftest.py); CI intentionally does not
        # opt in, since those require a live Ollama/hosted model or network
        # access this runner doesn't have.
        run: >-
          python -m pytest -q -n auto --dist load --durations=25
          --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload evaluation-lane run directories
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-runs
          path: eval_runs/ci
          if-no-files-found: ignore
          retention-days: 14
