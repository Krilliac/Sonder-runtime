name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install deps (stdlib core + mcp for server import)
        run: python -m pip install -r requirements-dev.txt
      - name: Verify MCP compatibility API
        run: >-
          python -c "from mcp.server.fastmcp import FastMCP;
          from mcp.server.fastmcp.tools import ToolManager"
      - name: Enforce architecture boundaries (SPEC-3)
        run: python scripts/check_architecture.py
      - name: Prevent new Git-history privacy debt
        run: python scripts/check_history_privacy.py --json
      - name: Run test suite
        run: python -m pytest -q
