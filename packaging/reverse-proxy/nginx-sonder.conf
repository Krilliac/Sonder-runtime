# Reference nginx TLS termination for the Sonder runtime (SPEC-2).
#
# Sonder itself binds loopback only; this proxy is the sole non-loopback
# surface. It terminates TLS 1.2+, enforces request-layer limits, forwards
# only approved paths, and strips untrusted forwarding headers.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sonder.example.internal;

    ssl_certificate     /etc/sonder/tls/fullchain.pem;
    ssl_certificate_key /etc/sonder/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Request-layer limits (mirror [server].max_request_bytes).
    client_max_body_size 1m;
    client_body_timeout  60s;
    proxy_read_timeout   300s;

    access_log /var/log/nginx/sonder-access.log;

    # Unauthenticated liveness only; everything else needs the bearer key.
    location = /live {
        proxy_pass http://127.0.0.1:11435;
    }

    # Approved application paths only. Add paths deliberately; there is no
    # catch-all proxy_pass.
    location /v1/ {
        # Strip untrusted forwarding headers before setting our own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_pass http://127.0.0.1:11435;
    }

    location / {
        return 404;
    }
}

# Plaintext HTTP: redirect only, never proxy.
server {
    listen 80;
    listen [::]:80;
    server_name sonder.example.internal;
    return 301 https://$host$request_uri;
}
