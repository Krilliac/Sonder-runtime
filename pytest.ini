[pytest]
# -ra: print a short summary line for every non-passing outcome (skips,
# xfails, errors), not just failures. Skips are otherwise invisible in CI
# output -- a marker typo that silently skips a whole file reads exactly
# like a passing run without this.
addopts = -ra
# Proposal modules ship in the desktop payload; omitting them here let their
# production-facing compatibility tests silently disappear from bare CI runs.
testpaths = tests proposals
# A hung test is invisible until someone kills the run and loses the evidence.
# After this many seconds in one test, pytest's built-in faulthandler dumps
# every thread's traceback to stderr and the run continues -- pure visibility,
# no behavior change. The slowest legitimate test measured 2026-08-22 finished
# well under this; see docs/wiki/20-test-suite-performance.md before raising it.
faulthandler_timeout = 300
markers =
    unit: isolated tests with no external services
    integration: tests spanning multiple Sonder modules or processes
    network: tests requiring explicit network access
    model: tests requiring an Ollama or hosted model
    requires_medium_integrity: needs a medium-integrity Windows process (MSYS2/Git Bash); selfmod runs these in a separately reported non-isolated gate
    heavy_memory: loads a large ML stack; selfmod runs these in a separately reported low-integrity gate with a larger Job memory limit
    real_lean_sandbox_helper: exercise the containment adapter instead of the test-only compiler shim
