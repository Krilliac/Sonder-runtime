name: sonder_runtime
description: Sonder Runtime — private, local AI orchestration for mobile and desktop.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # API and launcher bearer tokens must never be persisted in the plaintext
  # preferences store. This uses the platform credential/key store instead.
  flutter_secure_storage: ^10.3.1
  cupertino_icons: ^1.0.6
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  # IBM Plex (OFL 1.1, see fonts/OFL.txt): the UI face and the transcript,
  # code and status face. Bundled so an offline, private-first install never
  # fetches a font, and every platform renders the same hierarchy.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
