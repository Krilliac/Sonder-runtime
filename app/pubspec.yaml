name: sonder_runtime
description: Sonder Runtime — private, local AI orchestration for mobile and desktop.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  # API and launcher bearer tokens must never be persisted in the plaintext
  # preferences store. This uses the platform credential/key store instead.
  flutter_secure_storage: ^10.3.1
  cupertino_icons: ^1.0.6
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
